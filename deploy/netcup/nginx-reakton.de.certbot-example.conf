# Example layout after Certbot (order may differ on your VPS).
# Rule: each server{} that serves the site needs ONE include — no duplicate location /uploads/.

upstream reakton_next {
    server localhost:3010;
    keepalive 64;
}

# --- HTTPS (main) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name reakton.de www.reakton.de;
    # ssl_certificate ... (Certbot)

    client_max_body_size 64M;

    include /etc/nginx/snippets/reakton-static.conf;

    location / {
        proxy_pass http://reakton_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# --- HTTP (redirect or same app) ---
server {
    listen 80;
    listen [::]:80;
    server_name reakton.de www.reakton.de;

    client_max_body_size 64M;

    include /etc/nginx/snippets/reakton-static.conf;

    location / {
        proxy_pass http://reakton_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
