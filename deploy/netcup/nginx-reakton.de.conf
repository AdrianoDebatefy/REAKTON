# REAKTON — reakton.de
# Kopieren nach: /etc/nginx/sites-available/reakton.de
# Aktivieren: ln -s /etc/nginx/sites-available/reakton.de /etc/nginx/sites-enabled/

upstream reakton_next {
    server 127.0.0.1:3010;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name reakton.de www.reakton.de;

    # Certbot legt hier die HTTPS-Weiterleitung an
    location / {
        return 301 https://reakton.de$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name reakton.de www.reakton.de;

    # Certbot setzt ssl_certificate / ssl_certificate_key — nach certbot --nginx anpassen
    # ssl_certificate     /etc/letsencrypt/live/reakton.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/reakton.de/privkey.pem;

    client_max_body_size 64M;

    location / {
        proxy_pass http://reakton_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# www → apex (optional, Certbot kann das auch setzen)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.reakton.de;
    return 301 https://reakton.de$request_uri;
}
