# REAKTON — reakton.de (HTTP + HTTPS via Certbot)
# Nach certbot --nginx werden SSL-Blöcke ergänzt — proxy_set_header in BEIDEN Server-Blöcken prüfen.

upstream reakton_next {
    server 127.0.0.1:3010;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name reakton.de www.reakton.de;

    client_max_body_size 64M;

    location / {
        proxy_pass http://reakton_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect http://127.0.0.1:3010/ https://$host/;
        proxy_redirect http://localhost:3010/ https://$host/;
    }
}
