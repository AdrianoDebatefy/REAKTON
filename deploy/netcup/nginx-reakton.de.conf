# REAKTON — reakton.de (HTTP + HTTPS via Certbot)
# Nach certbot --nginx werden SSL-Blöcke ergänzt — proxy_set_header in BEIDEN Server-Blöcken prüfen.

upstream reakton_next {
    # Must match PM2 bind host (`-H localhost`), not 127.0.0.1 alone.
    server localhost:3010;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name reakton.de www.reakton.de;

    client_max_body_size 64M;

    location /uploads/ {
        alias /var/www/reakton/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /worlds/ {
        alias /var/www/reakton/public/worlds/;
        expires 7d;
        add_header Cache-Control "public";
        types {
            model/gltf-binary glb;
            image/jpeg jpg;
            image/svg+xml svg;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://reakton_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect http://127.0.0.1:3010/ https://$host/;
        proxy_redirect http://localhost:3010/ https://$host/;
    }
}
