# Static files — MUST be included in BOTH server { } blocks (port 80 AND 443).
# Copy: sudo cp deploy/netcup/reakton-static-locations.conf /etc/nginx/snippets/reakton-static.conf
# Then inside each server { listen 443 ... } and listen 80 block:
#   include /etc/nginx/snippets/reakton-static.conf;

location /uploads/ {
    alias /var/www/reakton/public/uploads/;
    expires 7d;
    add_header Cache-Control "public";
    add_header Accept-Ranges bytes;
}

location /nfc/ {
    alias /var/www/reakton/public/nfc/;
    expires 7d;
    add_header Cache-Control "public";
}

location /worlds/ {
    alias /var/www/reakton/public/worlds/;
    expires 7d;
    add_header Cache-Control "public";
    types {
        model/gltf-binary glb;
        image/jpeg jpg;
        image/svg+xml svg;
    }
    default_type application/octet-stream;
}
