# Static files — include in each server { } (80 + 443). No duplicate location /uploads/.
# IMPORTANT: Do NOT use location /nfc/ — it breaks Next.js route /nfc/tap (NFC scan).

location /uploads/ {
    alias /var/www/reakton/public/uploads/;
    expires 7d;
    add_header Cache-Control "public";
    add_header Accept-Ranges bytes;
}

location /nfc/player-v2/ {
    alias /var/www/reakton/public/nfc/player-v2/;
    expires 7d;
    add_header Cache-Control "public";
}

location /worlds/ {
    alias /var/www/reakton/public/worlds/;
    expires 7d;
    add_header Cache-Control "public";
    types {
        model/gltf-binary glb;
        image/jpeg jpg;
        image/svg+xml svg;
    }
    default_type application/octet-stream;
}
